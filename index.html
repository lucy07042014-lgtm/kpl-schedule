<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KPL 赛程 · 每日比赛，一键加日历</title>
  <meta name="description" content="王者荣耀 KPL 每日赛程：今天打谁、几点开赛、BO 几，一键导出 .ics 导入手机日历，开赛前自动提醒。" />
  <meta name="theme-color" content="#070a10" id="meta-theme" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KPL 赛程" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand-row">
        <span class="mark">KPL</span>
        <div class="brand-txt">
          <h1>赛程</h1>
          <p id="season">2026 KPL 年度总决赛</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btn-refresh" data-act="refresh" aria-label="刷新赛程" title="刷新赛程"></button>
          <button class="icon-btn" id="btn-theme" data-act="theme" aria-label="切换主题" title="切换主题"></button>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="赛程视图">
        <button class="tab" role="tab" data-act="tab" data-tab="today" aria-selected="true">今天<span class="badge" id="badge-today"></span></button>
        <button class="tab" role="tab" data-act="tab" data-tab="all" aria-selected="false">全部</button>
        <button class="tab" role="tab" data-act="tab" data-tab="mine" aria-selected="false">我的战队</button>
      </nav>
    </header>

    <main>
      <section id="hero" aria-label="焦点比赛"></section>
      <div id="view"></div>
    </main>
  </div>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <button class="btn btn-primary" data-act="export-all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3.2"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><path d="M12 13.2v5.2M9.4 15.8h5.2"/></svg>导出到日历</button>
      <button class="btn btn-ghost" data-act="sheet">导入说明</button>
    </div>
  </div>

  <div class="sheet-mask" id="sheet-mask" data-act="close-sheet"></div>
  <div class="sheet" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  <div class="detail-page" id="detail" role="dialog" aria-modal="true" aria-label="战报详情" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:20px;text-align:center">需要开启 JavaScript 才能查看赛程。</p>
  </noscript>

  <script src="lib.js"></script>
  <script src="data/data.js"></script>
  <script src="data/details.js"></script>
  <script src="data/lineups.js"></script>
  <script src="app.js"></script>
</body>
</html>
